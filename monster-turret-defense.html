<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#070b07;}
body{display:flex;justify-content:center;align-items:center;font-family:'Share Tech Mono','Courier New',monospace;}
#app{width:360px;max-width:100vw;height:100%;display:flex;flex-direction:column;overflow:hidden;}
#hud{background:#0e160e;border-bottom:2px solid #22351f;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;z-index:5;gap:6px;}
.st{display:flex;flex-direction:column;align-items:center;min-width:40px;}
.sl{font-size:7px;color:#3a6a34;text-transform:uppercase;letter-spacing:2px;margin-bottom:1px;}

.sv.lv{color:#e0504a;}.sv.lv.lo{animation:blink .5s infinite alternate;}

.btn{background:#0a1a0a;border:1.5px solid #2f7a2a;color:#7fd35a;font-family:inherit;font-size:10px;font-weight:bold;padding:6px 7px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;transition:all .15s;white-space:nowrap;border-radius:3px;}
.btn:hover:not(:disabled){background:#27601f;color:#fff;}
.btn:disabled{background:#0e160e;color:#1c3a18;border-color:#142a12;cursor:default;}

#bw.resume{border-color:#e6b800;color:#e6b800;background:#140f00;}
#sk{border-color:#6a4aa0;color:#a080e0;background:#140a1e;}
#sk:hover:not(:disabled){background:#2a1040;color:#d0b0ff;}
#ff{border-color:#3a5a38;color:#5f8a58;background:#0a140a;}
#ff.fast{border-color:#e6b800;color:#e6b800;background:#140f00;}
#cw{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden;}

#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);justify-content:flex-end;flex-direction:column;align-items:center;}
#modal.o{display:flex;}
#mbox{background:#0e160e;border:2px solid #22351f;border-bottom:none;width:360px;max-width:100vw;padding:14px 12px 28px;border-radius:10px 10px 0 0;max-height:65vh;overflow-y:auto;}
#mt{font-size:10px;color:#5fa04f;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:10px;text-align:center;padding-bottom:8px;border-bottom:1px solid #22351f;}
.mb{width:100%;background:#070b07;border:1px solid #22351f;color:#c4d8c0;font-family:inherit;font-size:13px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;transition:all .1s;border-radius:4px;flex-wrap:wrap;}

<script>
const CV=document.getElementById('gc'),ctx=CV.getContext('2d');
const W=360,H=490,TAU=Math.PI*2;let SC=1;
function resize(){
  const cw=document.getElementById('cw');
  SC=Math.min(cw.clientWidth/W,cw.clientHeight/H);
  CV.width=W;CV.height=H;
  CV.style.width=(W*SC)+'px';CV.style.height=(H*SC)+'px';
}
window.addEventListener('resize',resize);setTimeout(resize,50);

// ─── MAP ─────────────────────────────────────────────────────────────────────
// New slots are appended at the END of the list so old saves (index-based) still load.
const MAP={
  id:'graveyard',name:'GRAVEYARD',
  wps:[{x:70,y:-20},{x:70,y:80},{x:295,y:80},{x:295,y:195},{x:70,y:195},{x:70,y:310},{x:295,y:310},{x:295,y:430},{x:295,y:510}],
  slots:[
    {id:'p0',x:182,y:80,k:'path'},{id:'p1',x:182,y:195,k:'path'},{id:'p2',x:182,y:310,k:'path'},
    {id:'t0',x:120,y:40,k:'tower'},{id:'t1',x:182,y:40,k:'tower'},{id:'t2',x:245,y:40,k:'tower'},
    {id:'t3',x:30,y:135,k:'tower'},{id:'t4',x:182,y:135,k:'tower'},{id:'t5',x:340,y:135,k:'tower'},
    {id:'t6',x:30,y:250,k:'tower'},{id:'t7',x:182,y:250,k:'tower'},{id:'t8',x:340,y:250,k:'tower'},
    {id:'t9',x:30,y:360,k:'tower'},{id:'t10',x:182,y:360,k:'tower'},{id:'t11',x:340,y:360,k:'tower'},
    {id:'t12',x:120,y:135,k:'tower'},{id:'t13',x:245,y:135,k:'tower'},
    {id:'t14',x:120,y:250,k:'tower'},{id:'t15',x:245,y:250,k:'tower'},
    // extra trap slots
    {id:'p3',x:295,y:137,k:'path'},{id:'p4',x:70,y:252,k:'path'},{id:'p5',x:295,y:372,k:'path'},{id:'p6',x:70,y:38,k:'path'},
  ],
  theme:{bg:'#0a100a',grid:'#101a10',pathOuter:'#1c1a12',pathMid:'#2a261a',pathInner:'#25211a',pathDash:'#3a3524',
         slotTower:'#2c4a2a',slotTowerI:'#355a32',slotTowerF:'#142414'},
  tombs:[[20,20],[340,20],[338,195],[22,195],[340,310],[22,310],[20,445],[110,470],[160,470],[245,470]],
};
const PHW=19;
let PD;
function buildPathData(wps){
  const segs=[];let cum=0;
  for(let i=0;i<wps.length-1;i++){const dx=wps[i+1].x-wps[i].x,dy=wps[i+1].y-wps[i].y,l=Math.hypot(dx,dy);segs.push({x0:wps[i].x,y0:wps[i].y,x1:wps[i+1].x,y1:wps[i+1].y,l,cum,a:Math.atan2(dy,dx)});cum+=l;}
  return{segs,total:cum};
}
function posAt(d){
  for(const s of PD.segs){if(d<=s.cum+s.l){const t=(d-s.cum)/s.l;return{x:s.x0+t*(s.x1-s.x0),y:s.y0+t*(s.y1-s.y0),a:s.a};}}
  const l=PD.segs[PD.segs.length-1];return{x:l.x1,y:l.y1,a:l.a};
}

// ─── DIFFICULTY ──────────────────────────────────────────────────────────────
// money: starting funds · rewMult: kill reward multiplier · hpMult: enemy health multiplier
// countMult: wave size multiplier · drain: hearts lost per escaped enemy
const DIFFS={
  normal:  {name:'NORMAL',  col:'#4fbf3a',money:550,lives:25,rewMult:1,  hpMult:1,  countMult:1,   drain:1,
            desc:'The standard experience.'},
  hard:    {name:'HARD',    col:'#e0a020',money:400,lives:20,rewMult:.8, hpMult:1.2,countMult:1.25,drain:2,
            desc:'Less money, longer waves, tougher monsters. Escapees cost 2 hearts each.'},
  hardcore:{name:'HARDCORE',col:'#e0403a',money:400,lives:1, rewMult:.8, hpMult:1.2,countMult:1.25,drain:2,
            desc:'Same as Hard, but you only have 1 heart. One leak and it is over.'},
};

// ─── ENEMIES ─────────────────────────────────────────────────────────────────
// Damage hits armor first, then health. Piercing damage skips armor and hits health directly.
const EDEF={
  green:   {name:'GREEN ZOMBIE',hp:5,armor:2,spd:38,rew:5,r:10},
  red:     {name:'RED ZOMBIE',  hp:8,armor:3,spd:62,rew:7,r:10},
  skeleton:{name:'SKELETON',    hp:7,armor:5,spd:46,rew:8,r:10},
  spider:  {name:'SPIDER',      hp:3,armor:1,spd:56,rew:6,r:13},
  // Boss: hp / armor / reward / hearts-drained come from BOSS_TIERS (see below)
  king:    {name:'KING ZOMBIE', hp:0,armor:0,spd:28,rew:0,r:17,boss:true},
};
// The King Zombie appears on these waves, a bit stronger each time. Escorts are 60% of a normal wave.
// Armor = BOSS_ARMOR_MULT x what a green zombie has at that wave. Bosses resist crowd control:
// they can't be rooted, stuns last half as long, and slows are half as strong.
const BOSS_WAVES=[10,20,30,40,50];
const BOSS_TIERS=[
  {hp:120, rew:60, drain:3},
  {hp:300, rew:100,drain:4},
  {hp:600, rew:150,drain:5},
  {hp:1000,rew:220,drain:6},
  {hp:1600,rew:300,drain:8},
];
const BOSS_ARMOR_MULT=3, BOSS_ESCORT=.6;
const isBossWave=n=>BOSS_WAVES.includes(n);
const UNDEAD={green:1,red:1,skeleton:1};

// ─── ENCHANTMENTS ────────────────────────────────────────────────────────────
// Every turret has two slots: one ELEMENT (fire/frost/lightning) and one RUNE (everything else).
// The second enchantment on a turret costs 50% more.
const ENCH={
  fire:     {name:'RUNE OF FIRE',      slot:'element',cost:120,col:'#ff7a30',desc:'Hits ignite: 1 damage/sec for 3s'},
  frost:    {name:'RUNE OF FROST',     slot:'element',cost:100,col:'#6fd8ff',desc:'Hits slow the enemy ~25% for 2s'},
  lightning:{name:'RUNE OF LIGHTNING', slot:'element',cost:150,col:'#ffe040',desc:'Damage jumps to 2 nearby enemies'},
  pierce:   {name:'RUNE OF PIERCING',  slot:'rune',   cost:0,  col:'#ff5a40',desc:'Bypasses armor — damages health directly'},
  corrosion:{name:'RUNE OF CORROSION', slot:'rune',   cost:150,col:'#9acd32',desc:'Hits strip 1 extra armor, helping every turret'},
  haste:    {name:'RUNE OF HASTE',     slot:'rune',   cost:130,col:'#ffd060',desc:'+30% fire rate'},
  farsight: {name:'RUNE OF FAR-SIGHT', slot:'rune',   cost:90, col:'#80a0ff',desc:'+25% range'},
  echo:     {name:'RUNE OF ECHO',      slot:'rune',   cost:175,col:'#d080ff',desc:'15% chance to trigger twice'},
  plunder:  {name:'RUNE OF PLUNDER',   slot:'rune',   cost:130,col:'#e6b800',desc:'Kills by this turret pay +25%'},
  sunfire:  {name:'RUNE OF SUNFIRE',   slot:'rune',   cost:120,col:'#fff0a0',desc:'+50% damage to the undead (zombies, skeletons)'},
  time:     {name:'RUNE OF TIME',      slot:'rune',   cost:200,col:'#c090ff',desc:'Every 5s, stuns everything in range for 0.8s'},
};
const ALL_ENCH=Object.keys(ENCH);
function enchCost(kind,id,have){
  let c=id==='pierce'?Math.min(200,Math.max(120,Math.round(TD[kind].cost*.8/10)*10)):ENCH[id].cost;
  if(have>0)c=Math.round(c*1.5/5)*5;
  return c;
}

// ─── TURRETS & TRAPS ─────────────────────────────────────────────────────────
// range = radius in px. ench = enchantments this turret may carry.
const TD={
  // traps (path slots)
  mine:   {name:'LANDMINE',        cost:60, k:'path', range:20, ench:[],
           desc:'One big explosion, then it is spent.'},
  tar:    {name:'TAR PIT',         cost:90, k:'path', range:30, ench:['farsight','time'],
           desc:'Slows everything crossing it by half.'},
  spike:  {name:'SPIKE TRAP',      cost:100,k:'path', range:28, ench:ALL_ENCH,
           desc:'Stabs everything standing on it.'},
  bear:   {name:'BEAR TRAP',       cost:120,k:'path', range:22, ench:['haste','farsight','time'],
           desc:'Roots the first enemy for 3s, then resets. Bosses are immune.'},
  oil:    {name:'OIL SLICK',       cost:140,k:'path', range:32, ench:['farsight'],
           desc:'Harmless — until fire hits it. Then it erupts.'},
  grinder:{name:'GRINDER',         cost:300,k:'path', range:30, ench:ALL_ENCH,
           desc:'Heavy damage, fast, to everything on it.'},
  // turrets (tower slots)
  gatling:{name:'GATLING TURRET',  cost:125,k:'tower',range:105,ench:ALL_ENCH,
           desc:'Fast, weak bolts. Strong against low armor.'},
  frost:  {name:'FROST TOTEM',     cost:150,k:'tower',range:90, ench:['farsight','time'],
           desc:'No damage. Slows everything in range.'},
  cannon: {name:'SHRAPNEL CANNON', cost:150,k:'tower',range:130,ench:ALL_ENCH,
           desc:'Shell bursts into fragments in all directions.'},
  ballista:{name:'CROSSBOW BALLISTA',cost:175,k:'tower',range:175,ench:ALL_ENCH,
           desc:'One slow, powerful bolt. Long range.'},
  brazier:{name:'BRAZIER',         cost:175,k:'tower',range:62, ench:ALL_ENCH.filter(x=>x!=='fire'),
           desc:'Short-range flame cone that sets enemies alight.'},
  shrine: {name:'HOLY SHRINE',     cost:200,k:'tower',range:110,ench:ALL_ENCH,
           desc:'Beam that smites the undead. Ignores spiders.'},
  bomber: {name:'BOMB LAUNCHER',   cost:200,k:'tower',range:140,ench:ALL_ENCH,
           desc:'Lobs a bomb that explodes on impact.'},
  tesla:  {name:'TESLA COIL',      cost:225,k:'tower',range:95, ench:ALL_ENCH.filter(x=>x!=='lightning'),
           desc:'Lightning that chains between nearby enemies.'},
  drum:   {name:'WAR DRUM',        cost:250,k:'tower',range:100,ench:['farsight','time'],
           desc:'Nearby turrets fire 25% faster.'},
  sniper: {name:'SNIPER NEST',     cost:275,k:'tower',range:260,ench:ALL_ENCH,
           desc:'Very long range. Choose who it targets.'},
};
// behavior stats
const ST={
  spike:{cd:1.0,dmg:2}, grinder:{cd:.4,dmg:4},
  mine:{dmg:10,blast:48}, bear:{root:3,reset:8}, oil:{dmg:6,blast:38,reset:10},
  gatling:{cd:.35,dmg:1}, ballista:{cd:2.4,dmg:6}, brazier:{cd:.5,dmg:1,cone:.6},
  shrine:{cd:.5,dmg:2}, tesla:{cd:1.1,dmg:2,jumps:3,jr:55}, sniper:{cd:3.2,dmg:10},
  drum:{buff:.25}, time:{every:5,stun:.8},
};
const CANNON={cd:1.6,shellSpd:230,frags:12,fragDmg:1,fragSpd:240,fragRange:75};
const BOMB  ={cd:3.0,spd:170,radius:52,dmg:5};
const MODES=['strongest','armored','first','last'];

// ─── WAVES (50) ──────────────────────────────────────────────────────────────
// Waves 1-10 are hand-written. After that, wave size grows steadily and monsters scale:
//   armor +3%/wave and kill rewards +3%/wave (relative to wave 10). Health is +5%/wave from wave 1.
const BASE_WAVES=[
  {g:8 },                               // 1
  {g:12},                               // 2
  {g:10,r:4},                           // 3  red zombies
  {g:8, r:8},                           // 4
  {g:8, r:6, s:4},                      // 5  skeletons
  {g:10,r:6, s:6},                      // 6
  {g:8, r:6, s:6, p:6},                 // 7  spiders
  {g:10,r:8, s:8, p:8},                 // 8
  {g:10,r:10,s:10,p:10},                // 9
  {g:12,r:12,s:12,p:12},                // 10
];
const WAVE_COUNT=50;
const SKIP_TO=25;
function waveDef(n){
  if(n<=BASE_WAVES.length)return BASE_WAVES[n-1];
  const total=Math.round(48+(n-10)*1.5);           // 48 at wave 10 → 108 at wave 50
  const wt=[1,1,1,1];wt[n%4]=1.5;                   // each wave leans on one monster type
  const sum=wt.reduce((a,b)=>a+b,0);
  const c=wt.map(w=>Math.floor(total*w/sum));
  c[0]+=total-c.reduce((a,b)=>a+b,0);
  return{g:c[0],r:c[1],s:c[2],p:c[3]};
}
const over10=n=>Math.max(0,n-10);
const hpScale=n=>1+(n-1)*.05;                       // +5% health per wave, from wave 1
const armorScale=n=>1+over10(n)*.03;
const rewScale=n=>1+over10(n)*.03;
const spawnGap=n=>Math.max(.35,.6-over10(n)*.006);

let G,D,lastT=0,eid=0,gameSpeed=1,gamePaused=false;

// ─── AUDIO ───────────────────────────────────────────────────────────────────
const SFX = (() => {
  let AC = null, masterGain = null;
  let activeCount = 0;
  const MAX_CONCURRENT = 12;
  const cooldowns = {};
  const cooldownTimes = {
    cannonFire:0.05, bombFire:0, shrapnel:0.05, boom:0, spikeHit:0.10, clank:0.05,
    armorBreak:0.07, enemyDie:0.04, escape:0.25, waveStart:0, gameWin:0, gameOver:0,
    towerBuild:0, towerUpgrade:0, gat:0.05, bolt:0.05, zap:0.06, flame:0.10, snap:0, holy:0.12, bossWave:0,
  };
  function init() {
    if (AC) return true;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.55;
      masterGain.connect(AC.destination);
      return true;
    } catch(e) { return false; }
  }
  function canPlay(id) {
    if (!init()) return false;
    if (activeCount >= MAX_CONCURRENT) return false;
    const now = AC.currentTime;
    if (cooldowns[id] && now < cooldowns[id]) return false;
    const ct = cooldownTimes[id] || 0;
    if (ct > 0) cooldowns[id] = now + ct;
    return true;
  }
  function env(atk, sus, rel, peak = 1.0) {
    const g = AC.createGain(), now = AC.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(peak, now + atk);
    g.gain.setValueAtTime(peak, now + atk + sus);
    g.gain.exponentialRampToValueAtTime(0.0001, now + atk + sus + rel);
    g.connect(masterGain);

  function osc(type, freq, atk, sus, rel, vol = 1.0, freqEnd = null) {

function mkTower(kind){
  return{kind,base:TD[kind].cost,spent:TD[kind].cost,ench:{element:null,rune:null},
    cdt:0,flashT:0,recoil:0,mode:'strongest',drum:0};
}
function init(diffId){
  D=DIFFS[diffId];D.id=diffId;
  PD=buildPathData(MAP.wps);
  gamePaused=false;
  G={money:D.money,lives:D.lives,wave:0,phase:'prep',
    slots:MAP.slots.map(s=>({...s,tower:null})),
    en:[],proj:[],frag:[],expl:[],part:[],flt:[],fx:[],rings:[],
    spawnQ:[],spawnTimer:0,betweenTimer:0,killed:0,escaped:0,sel:null};
}

function hud(){
  const vl=document.getElementById('vl');
  vl.textContent=G.lives;
  vl.className='sv lv'+(G.lives<=3?' lo':'');
  document.getElementById('vm').textContent=G.money;
  document.getElementById('vw').textContent=G.wave+'/'+WAVE_COUNT;
  document.getElementById('infobar').textContent=D.name+' · TAP SLOT TO BUILD · TAP TURRET TO ENCHANT/SELL';
}

function waveTotal(n){
  const w=waveDef(n),f=isBossWave(n)?BOSS_ESCORT:1;
  return['g','r','s','p'].reduce((a,k)=>a+Math.ceil((w[k]||0)*D.countMult*f),0)+(isBossWave(n)?1:0);
}
// Estimated income from waves 1..n-1 (65% of kills, like the original's skip button)
function skipFunds(n){
  const map={g:'green',r:'red',s:'skeleton',p:'spider'};let sum=0;
  for(let w=1;w<n;w++){const d=waveDef(w);
    const f=isBossWave(w)?BOSS_ESCORT:1;
    for(const k in map)sum+=Math.ceil((d[k]||0)*D.countMult*f)*Math.round(EDEF[map[k]].rew*D.rewMult*rewScale(w));
    if(isBossWave(w))sum+=Math.round(BOSS_TIERS[BOSS_WAVES.indexOf(w)].rew*D.rewMult);}
  return D.money+Math.floor(sum*.65);
}
function buildQueue(w,boss){
  const q=[],map={g:'green',r:'red',s:'skeleton',p:'spider'},f=boss?BOSS_ESCORT:1;
  for(const k in map){const n=Math.ceil((w[k]||0)*D.countMult*f);for(let i=0;i<n;i++)q.push(map[k]);}
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  if(boss)q.unshift('king'); // the king leads the horde
  return q;
}

function startWave(){
  G.wave++;
  const boss=isBossWave(G.wave);
  G.spawnQ=buildQueue(waveDef(G.wave),boss);
  G.spawnTimer=0.45;G.phase='wave';
  if(boss){
    G.flt.push({x:W/2,y:H/2-20,txt:'BOSS WAVE '+G.wave,sub:'THE KING ZOMBIE APPROACHES',life:2.2,max:2.2,big:true,col:'#ffd040'});
    SFX.bossWave();
  }else{
    G.flt.push({x:W/2,y:H/2-20,txt:'WAVE '+G.wave,sub:G.spawnQ.length+' INCOMING',life:1.8,max:1.8,big:true});
    SFX.waveStart();
  }
  hud();
}

function mkEnemy(type,wave){
  const def=EDEF[type],w=wave||1;
  let hp,armor,rew,boss=false,drain=1;
  if(def.boss){
    const tier=BOSS_TIERS[Math.max(0,BOSS_WAVES.indexOf(w))];
    hp=Math.ceil(tier.hp*D.hpMult);
    armor=Math.ceil(EDEF.green.armor*armorScale(w))*BOSS_ARMOR_MULT;
    rew=Math.round(tier.rew*D.rewMult);drain=tier.drain;boss=true;
  }else{
    hp=def.hp*D.hpMult*hpScale(w); // fractional on purpose, so each wave is a clean +5%
    armor=Math.ceil(def.armor*armorScale(w));
    rew=Math.round(def.rew*D.rewMult*rewScale(w));
  }
  return{id:eid++,type,hp,maxHp:hp,armor,maxArmor:armor,spd:def.spd,d:-20,r:def.r,
    rew,boss,drain,dead:false,flash:0,slow:null,burn:null,rootT:0,stunT:0};
}

const BLOOD={king:'#5fb04a',green:'#5fb04a',red:'#b02a2a',skeleton:'#ece6d2',spider:'#4a8a3a'};
function burst(x,y,col,n,spd,life,size){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=Math.random()*spd+spd*.3;
    G.part.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:life*(.6+Math.random()*.4),max:life,col,r:Math.random()*size+size*.5});}
}

// ─── COMBAT HELPERS ──────────────────────────────────────────────────────────
function hasE(t,id){return t.ench.element===id||t.ench.rune===id;}
function rangeOf(t){return TD[t.kind].range*(hasE(t,'farsight')?1.25:1);}
function rateOf(t){return (hasE(t,'haste')?1.3:1)*(1+(t.drum||0));}

function enemiesIn(x,y,r){
  const out=[];
  for(const e of G.en){if(e.dead||e.d<0)continue;const p=posAt(e.d);if(Math.hypot(p.x-x,p.y-y)<r)out.push(e);}
  return out;
}
function pickTarget(x,y,range,mode,filter){
  let best=null,bs=-Infinity;
  for(const e of G.en){
    if(e.dead||e.d<0)continue;
    if(filter&&!filter(e))continue;
    const p=posAt(e.d);if(Math.hypot(p.x-x,p.y-y)>=range)continue;
    let s;
    if(mode==='last')s=-e.d;
    else if(mode==='strongest')s=e.hp+e.armor+e.d*1e-4;
    else if(mode==='armored')s=e.armor*1000+e.d*1e-2;
    else s=e.d;
    if(s>bs){bs=s;best=e;}
  }
  return best;
}
function leadPoint(e,sx,sy,spd){
  let p=posAt(e.d);
  for(let i=0;i<2;i++){const tt=Math.hypot(p.x-sx,p.y-sy)/spd;p=posAt(Math.min(e.d+e.spd*tt,PD.total));}
  return p;
}

function chill(e,key,m,t){if(e.boss)m=1-(1-m)*.5;(e.slow||(e.slow={}))[key]={m,t};}
function ignite(e,src,pierce){
  if(e.dead)return;
  if(e.burn){e.burn.t=3;e.burn.src=src;e.burn.pierce=pierce;}
  else e.burn={t:3,tick:1,src,pierce};
}

function zapFx(a,b,col){
  const pts=[a];
  const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  for(let i=1;i<5;i++){const f=i/5,o=(Math.random()-.5)*9;pts.push({x:a.x+dx*f+nx*o,y:a.y+dy*f+ny*o});}
  pts.push(b);
  G.fx.push({pts,life:.2,max:.2,col:col||'#ffec80',w:2});
  SFX.zap();
}
// lightning jump: nearest un-hit enemies within r of the previous one
function chain(from,dmg,pierce,src,n,r){
  let cur=posAt(from.d);const used=new Set([from.id]);
  for(let i=0;i<n;i++){
    let best=null,bd=r;
    for(const o of G.en){
      if(o.dead||o.d<0||used.has(o.id))continue;
      const p=posAt(o.d),dd=Math.hypot(p.x-cur.x,p.y-cur.y);
      if(dd<bd){bd=dd;best=o;}
    }
    if(!best)break;
    used.add(best.id);
    const bp=posAt(best.d);
    zapFx(cur,bp);
    dmgEnemy(best,dmg,pierce,src);
    cur=bp;
  }
}

// Damage an enemy. Armor absorbs damage first; piercing damage skips armor entirely.
function dmgEnemy(e,dmg,pierce,src){
  if(e.dead||dmg<=0)return;
  const p=posAt(e.d);
  if(!pierce&&e.armor>0){
    const a=Math.min(e.armor,dmg);
    e.armor-=a;dmg-=a;
    if(e.armor<=0){SFX.armorBreak();burst(p.x,p.y,'#b8c4d4',8,130,.45,2.5);}
    else SFX.clank();
  }
  e.flash=.1;
  if(dmg<=0)return;
  e.hp-=dmg;
  if(e.hp<=0){
    e.dead=true;G.killed++;
    const rew=Math.round(e.rew*(src&&hasE(src,'plunder')?1.25:1));
    G.money+=rew;
    if(e.boss){
      SFX.boom();burst(p.x,p.y,'#f0c830',30,260,.9,5);burst(p.x,p.y,BLOOD.king,24,200,.8,4);
      G.flt.push({x:W/2,y:H/2-20,txt:'KING SLAIN!  +$'+rew,life:2,max:2,big:true,col:'#ffd040'});
    }else{
      SFX.enemyDie();burst(p.x,p.y,BLOOD[e.type],12,170,.6,3.5);
      G.flt.push({x:p.x+((Math.random()-.5)*16),y:p.y-14,txt:'+$'+rew,life:.8,max:.8,big:false});
    }
    hud();
  }
}
// A turret's hit: applies its enchantments, then deals damage.
function hitEnemy(e,dmg,pierce,src,opt){
  if(e.dead)return;
  opt=opt||{};
  if(src){
    if(UNDEAD[e.type]&&hasE(src,'sunfire'))dmg*=1.5;
    if(hasE(src,'corrosion')&&e.armor>0)e.armor=Math.max(0,e.armor-1);
    if(hasE(src,'fire'))ignite(e,src,pierce);
    if(hasE(src,'frost'))chill(e,'rune',.75,2);
    if(hasE(src,'lightning')&&!opt.noChain)chain(e,dmg*.5,pierce,src,2,55);
  }
  dmgEnemy(e,dmg,pierce,src);
}

function launch(kind,sx,sy,tp,spd,pierce,src){
  const dx=tp.x-sx,dy=tp.y-sy,l=Math.hypot(dx,dy)||1;
  G.proj.push({kind,x:sx,y:sy,tx:tp.x,ty:tp.y,vx:dx/l*spd,vy:dy/l*spd,spd,pierce,src,dead:false});
}
function explodeShell(x,y,pierce,src){
  SFX.shrapnel();
  burst(x,y,'#ffcc66',8,120,.3,2.5);
  const off=Math.random()*TAU;
  for(let i=0;i<CANNON.frags;i++){
    const a=off+i/CANNON.frags*TAU;
    G.frag.push({x,y,vx:Math.cos(a)*CANNON.fragSpd,vy:Math.sin(a)*CANNON.fragSpd,
      life:CANNON.fragRange/CANNON.fragSpd,pierce,src,dead:false});
  }
}
function igniteOilNear(x,y,r){
  for(const sl of G.slots){
    const t=sl.tower;
    if(t&&t.kind==='oil'&&Math.hypot(sl.x-x,sl.y-y)<r+TD.oil.range)t.igniteFlag=true;
  }
}
function explodeBomb(x,y,pierce,src){
  SFX.boom();
  G.expl.push({x,y,r:6,maxR:BOMB.radius,life:.35,max:.35});
  burst(x,y,'#ff8800',22,230,.7,5);burst(x,y,'#ffdd00',10,160,.5,4);
  for(const e of G.en){
    if(e.dead)continue;
    const p=posAt(e.d);
    if(Math.hypot(p.x-x,p.y-y)<BOMB.radius+e.r*.5)hitEnemy(e,BOMB.dmg,pierce,src,{noChain:true});
  }
  igniteOilNear(x,y,BOMB.radius);
}

// ─── TURRET BEHAVIORS ────────────────────────────────────────────────────────
// Each returns true if it fired (so Echo can trigger a free repeat).
// `f` = forced (an echo): skip the cooldown check.
function pulse(sl,t,f,S){
  if(t.cdt>0&&!f)return false;
  const hit=enemiesIn(sl.x,sl.y,rangeOf(t));
  if(!hit.length)return false;
  t.cdt=S.cd;t.flashT=.18;SFX.spikeHit();
  burst(sl.x,sl.y,'#9a9a9a',5,80,.35,2);
  const pc=hasE(t,'pierce');
  for(const e of hit)hitEnemy(e,S.dmg,pc,t);
  return true;
}
function shoot(sl,t,tgt,dmg,col,w,recoil){
  const tp=posAt(tgt.d);
  t.aim=Math.atan2(tp.y-sl.y,tp.x-sl.x);t.recoil=recoil;
  G.fx.push({pts:[{x:sl.x,y:sl.y},tp],life:.09,max:.09,col,w});
  hitEnemy(tgt,dmg,hasE(t,'pierce'),t);
}
function undeadOnly(e){return !!UNDEAD[e.type];}

const TB={
  spike(sl,t,dt,f){return pulse(sl,t,f,ST.spike);},
  grinder(sl,t,dt,f){return pulse(sl,t,f,ST.grinder);},
  tar(sl,t){for(const e of enemiesIn(sl.x,sl.y,rangeOf(t)))chill(e,'tar',.5,.5);},
  mine(sl,t){
    if(!enemiesIn(sl.x,sl.y,rangeOf(t)).length)return;
    SFX.boom();
    G.expl.push({x:sl.x,y:sl.y,r:6,maxR:ST.mine.blast,life:.35,max:.35});
    burst(sl.x,sl.y,'#ff8800',18,200,.6,4.5);
    for(const e of enemiesIn(sl.x,sl.y,ST.mine.blast))hitEnemy(e,ST.mine.dmg,false,null,{noChain:true});
    igniteOilNear(sl.x,sl.y,ST.mine.blast);
    sl.tower=null; // spent
  },
  bear(sl,t){
    if(t.cdt>0)return;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),'first',e=>!(e.rootT>0)&&!e.boss);
    if(!tgt)return;
    tgt.rootT=ST.bear.root;t.cdt=ST.bear.reset;t.flashT=.3;SFX.snap();
    const p=posAt(tgt.d);burst(p.x,p.y,'#c8a060',8,100,.35,2.5);
  },
  oil(sl,t){
    if(t.cdt>0)return;
    const inside=enemiesIn(sl.x,sl.y,rangeOf(t));
    if(!(t.igniteFlag||inside.some(e=>e.burn)))return;
    const victims=enemiesIn(sl.x,sl.y,ST.oil.blast*(rangeOf(t)/TD.oil.range));
    t.igniteFlag=false;
    if(!victims.length)return;
    t.cdt=ST.oil.reset;t.flashT=.6;SFX.flame();SFX.boom();
    burst(sl.x,sl.y,'#ff7a20',20,170,.6,4);burst(sl.x,sl.y,'#ffd040',10,120,.5,3);
    G.expl.push({x:sl.x,y:sl.y,r:6,maxR:ST.oil.blast,life:.4,max:.4});
    for(const e of victims){dmgEnemy(e,ST.oil.dmg,false,t);ignite(e,t,false);}
  },
  gatling(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),'first');if(!tgt)return false;
    shoot(sl,t,tgt,ST.gatling.dmg,'#ffe9a0',1.2,.06);t.cdt=ST.gatling.cd;SFX.gat();return true;
  },
  ballista(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),'first');if(!tgt)return false;
    shoot(sl,t,tgt,ST.ballista.dmg,'#d8c090',2.5,.2);t.cdt=ST.ballista.cd;SFX.bolt();return true;
  },
  sniper(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),t.mode||'strongest');if(!tgt)return false;
    shoot(sl,t,tgt,ST.sniper.dmg,'#ffffff',1.3,.25);t.cdt=ST.sniper.cd;SFX.bolt();return true;
  },
  shrine(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),'first',undeadOnly);if(!tgt)return false;
    shoot(sl,t,tgt,ST.shrine.dmg,'#ffe880',2.2,0);t.flashT=.2;t.cdt=ST.shrine.cd;SFX.holy();return true;
  },
  tesla(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),'first');if(!tgt)return false;
    const tp=posAt(tgt.d),pc=hasE(t,'pierce');
    t.flashT=.2;t.cdt=ST.tesla.cd;
    zapFx({x:sl.x,y:sl.y-10},tp,'#9fd8ff');
    hitEnemy(tgt,ST.tesla.dmg,pc,t,{noChain:true});
    chain(tgt,ST.tesla.dmg,pc,t,ST.tesla.jumps,ST.tesla.jr);
    return true;
  },
  brazier(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const r=rangeOf(t),tgt=pickTarget(sl.x,sl.y,r,'first');if(!tgt)return false;
    const tp=posAt(tgt.d),aim=Math.atan2(tp.y-sl.y,tp.x-sl.x);
    t.aim=aim;t.cdt=ST.brazier.cd;t.flashT=.25;SFX.flame();
    for(let i=0;i<9;i++){
      const a=aim+(Math.random()-.5)*ST.brazier.cone*2,s=90+Math.random()*90;
      G.part.push({x:sl.x,y:sl.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0,life:.3,max:.3,col:i%2?'#ff8a20':'#ffd040',r:Math.random()*3+2});
    }
    const pc=hasE(t,'pierce');
    for(const e of enemiesIn(sl.x,sl.y,r)){
      const p=posAt(e.d);
      let da=Math.atan2(p.y-sl.y,p.x-sl.x)-aim;da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)<=ST.brazier.cone){hitEnemy(e,ST.brazier.dmg,pc,t);ignite(e,t,pc);}
    }
    return true;
  },
  frost(sl,t,dt){
    const r=rangeOf(t),hit=enemiesIn(sl.x,sl.y,r);
    for(const e of hit)chill(e,'totem',.6,.5);
    t.pulseT=(t.pulseT||0)-dt;
    if(hit.length&&t.pulseT<=0){t.pulseT=1.5;G.rings.push({x:sl.x,y:sl.y,r:6,maxR:r,life:.6,max:.6,col:'#6fd8ff'});}
  },
  drum(){}, // buff is applied before the turret loop
  cannon(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),'first');if(!tgt)return false;
    const tp=leadPoint(tgt,sl.x,sl.y,CANNON.shellSpd);
    t.aim=Math.atan2(tp.y-sl.y,tp.x-sl.x);t.recoil=.14;
    launch('shell',sl.x,sl.y,tp,CANNON.shellSpd,hasE(t,'pierce'),t);
    SFX.cannonFire();t.cdt=CANNON.cd;return true;
  },
  bomber(sl,t,dt,f){
    if(t.cdt>0&&!f)return false;
    const tgt=pickTarget(sl.x,sl.y,rangeOf(t),'first');if(!tgt)return false;
    const tp=leadPoint(tgt,sl.x,sl.y,BOMB.spd);
    t.aim=Math.atan2(tp.y-sl.y,tp.x-sl.x);t.recoil=.2;
    launch('bomb',sl.x,sl.y,tp,BOMB.spd,hasE(t,'pierce'),t);
    SFX.bombFire();t.cdt=BOMB.cd;return true;
  },
};

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function tickFx(dt){
  for(const p of G.part){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g!==undefined?p.g:200)*dt;p.life-=dt;}
  G.part=G.part.filter(p=>p.life>0);
  for(const f of G.flt){f.y-=(f.big?28:38)*dt;f.life-=dt;}
  G.flt=G.flt.filter(f=>f.life>0);
  for(const f of G.fx)f.life-=dt;
  G.fx=G.fx.filter(f=>f.life>0);
  for(const r of G.rings){r.life-=dt;r.r=r.maxR*(1-r.life/r.max);}
  G.rings=G.rings.filter(r=>r.life>0);
}

function upd(dt){
  tickFx(dt);

  if(G.phase==='between'){
    G.betweenTimer-=dt;
    if(G.betweenTimer<=0)startWave();
    return;
  }
  if(G.phase!=='wave')return;

  // Spawn
  G.spawnTimer-=dt;
  if(G.spawnTimer<=0&&G.spawnQ.length>0){
    G.en.push(mkEnemy(G.spawnQ.shift(),G.wave));
    G.spawnTimer=G.spawnQ.length?spawnGap(G.wave):0;
  }

  // Move enemies (status effects first)
  for(const e of G.en){
    if(e.dead)continue;
    if(e.flash>0)e.flash-=dt;
    let m=1;
    if(e.stunT>0){e.stunT-=dt;m=0;}
    if(e.rootT>0){e.rootT-=dt;m=0;}
    if(e.slow){
      let sm=1;
      for(const k in e.slow){const s=e.slow[k];s.t-=dt;if(s.t<=0)delete e.slow[k];else sm=Math.min(sm,s.m);}
      m*=sm;
    }
    if(e.burn){
      e.burn.t-=dt;e.burn.tick-=dt;
      if(e.burn.tick<=0){
        e.burn.tick+=1;
        const p=posAt(e.d);burst(p.x,p.y-4,'#ff8a20',3,50,.3,2);
        dmgEnemy(e,1,e.burn.pierce,e.burn.src);
      }
      if(e.burn&&e.burn.t<=0)e.burn=null;
    }
    if(e.dead)continue;
    e.d+=e.spd*m*dt;
    if(e.d>=PD.total){
      const loss=(e.drain||1)*D.drain;
      e.dead=true;G.lives=Math.max(0,G.lives-loss);G.escaped++;
      G.flt.push({x:W/2,y:H-80,txt:(e.boss?'THE KING ESCAPED! -':'BREACH! -')+loss+(loss>1?' HEARTS':' HEART'),life:e.boss?1.6:.9,max:e.boss?1.6:.9,big:false,col:'#f85149'});
      SFX.escape();
      if(G.lives<=0){SFX.gameOver();endGame(false);return;}
      hud();
    }
  }
  G.en=G.en.filter(e=>!e.dead);

  // War drum buffs
  for(const sl of G.slots)if(sl.tower)sl.tower.drum=0;
  for(const sl of G.slots){
    const t=sl.tower;if(!t||t.kind!=='drum')continue;
    const r=rangeOf(t);
    for(const o of G.slots)if(o!==sl&&o.tower&&Math.hypot(o.x-sl.x,o.y-sl.y)<r)o.tower.drum=Math.max(o.tower.drum||0,ST.drum.buff);
  }

  // Turret logic
  for(const sl of G.slots){
    const t=sl.tower;if(!t)continue;
    t.cdt-=dt*rateOf(t);
    if(t.flashT>0)t.flashT-=dt;
    if(t.recoil>0)t.recoil-=dt;
    // Rune of Time
    if(hasE(t,'time')){
      t.timeT=(t.timeT===undefined?ST.time.every:t.timeT)-dt;
      if(t.timeT<=0){
        const r=rangeOf(t),hit=enemiesIn(sl.x,sl.y,r);
        if(hit.length){
          for(const e of hit)e.stunT=Math.max(e.stunT||0,ST.time.stun*(e.boss?.5:1));
          G.rings.push({x:sl.x,y:sl.y,r:6,maxR:r,life:.5,max:.5,col:'#c090ff'});
          t.timeT=ST.time.every;
        }else t.timeT=.5;
      }
    }
    const fn=TB[t.kind];
    const fired=fn(sl,t,dt,false);
    if(fired&&sl.tower===t&&hasE(t,'echo')&&Math.random()<.15)fn(sl,t,dt,true);
  }

  // Shells & bombs — detonate on arrival or on contact with any enemy
  for(const p of G.proj){
    if(p.dead)continue;
    const step=p.spd*dt,dist=Math.hypot(p.tx-p.x,p.ty-p.y);
    let boom=false;
    if(dist<=step){p.x=p.tx;p.y=p.ty;boom=true;}
    else{
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      for(const e of G.en){
        if(e.dead||e.d<0)continue;
        const ep=posAt(e.d);
        if(Math.hypot(ep.x-p.x,ep.y-p.y)<e.r+4){boom=true;break;}
      }
    }
    if(boom){
      p.dead=true;
      if(p.kind==='shell')explodeShell(p.x,p.y,p.pierce,p.src);else explodeBomb(p.x,p.y,p.pierce,p.src);
    }
  }
  G.proj=G.proj.filter(p=>!p.dead);

  // Shrapnel fragments — each one damages the first enemy it touches
  for(const f of G.frag){
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;
    if(f.life<=0){f.dead=true;continue;}
    for(const e of G.en){
      if(e.dead||e.d<0)continue;
      const ep=posAt(e.d);
      if(Math.hypot(ep.x-f.x,ep.y-f.y)<e.r+3){
        hitEnemy(e,CANNON.fragDmg,f.pierce,f.src);
        f.dead=true;break;
      }
    }
  }
  G.frag=G.frag.filter(f=>!f.dead);

  // Explosion visuals
  for(const x of G.expl){x.life-=dt;x.r=x.maxR*(1-x.life/x.max);}
  G.expl=G.expl.filter(x=>x.life>0);

  // Wave complete?
  if(G.spawnQ.length===0&&G.en.length===0&&G.proj.length===0&&G.frag.length===0&&G.expl.length===0){
    if(G.wave>=WAVE_COUNT){SFX.gameWin();setTimeout(()=>endGame(true),700);G.phase='done';}
    else{
      G.phase='between';G.betweenTimer=1.5;saveGame();
      const nb=isBossWave(G.wave+1);
      G.flt.push({x:W/2,y:H/2,txt:nb?'! BOSS INCOMING !':'WAVE '+(G.wave+1)+' INCOMING',sub:nb?'THE KING ZOMBIE COMES':'PREPARE DEFENSES',
        life:nb?2.4:1.4,max:nb?2.4:1.4,big:true,col:nb?'#ffd040':undefined});
      const bw=document.getElementById('bw');
      if(!gamePaused){bw.textContent='⏸ PAUSE';bw.className='btn pause';bw.disabled=false;}
    }
  }
}

// ─── DRAW ────────────────────────────────────────────────────────────────────
function drawPathLayer(col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';strokePath();}
function strokePath(){const wps=MAP.wps;ctx.beginPath();ctx.moveTo(wps[0].x,wps[0].y);for(let i=1;i<wps.length;i++)ctx.lineTo(wps[i].x,wps[i].y);ctx.stroke();}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawTomb(x,y){
  ctx.fillStyle='#1a241a';ctx.strokeStyle='#2c3c2c';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x-6,y+8);ctx.lineTo(x-6,y-3);ctx.arc(x,y-3,6,Math.PI,0);ctx.lineTo(x+6,y+8);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='#3a4c3a';ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x,y+3);ctx.moveTo(x-3,y-2);ctx.lineTo(x+3,y-2);ctx.stroke();
}

function draw(){
  if(!G)return;
  const TH=MAP.theme;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=TH.bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=TH.grid;ctx.lineWidth=.7;
  for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(const [tx,ty] of MAP.tombs)drawTomb(tx,ty);

  drawPathLayer(TH.pathOuter,PHW*2+8);
  drawPathLayer(TH.pathMid,PHW*2);
  drawPathLayer(TH.pathInner,PHW*2-6);
  ctx.save();ctx.strokeStyle=TH.pathDash;ctx.lineWidth=1.5;ctx.setLineDash([6,10]);strokePath();ctx.setLineDash([]);ctx.restore();

  // Empty slots
  for(const sl of G.slots){
    if(sl.tower)continue;
    if(sl.k==='path'){
      ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(sl.x-13,sl.y-13,26,26);
      ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1.5;ctx.strokeRect(sl.x-13,sl.y-13,26,26);
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sl.x-8,sl.y);ctx.lineTo(sl.x+8,sl.y);ctx.moveTo(sl.x,sl.y-8);ctx.lineTo(sl.x,sl.y+8);ctx.stroke();
    }else{
      ctx.strokeStyle=TH.slotTower;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sl.x,sl.y,13,0,TAU);ctx.stroke();
      ctx.strokeStyle=TH.slotTowerI;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(sl.x,sl.y,8,0,TAU);ctx.stroke();
      ctx.fillStyle=TH.slotTowerF;ctx.beginPath();ctx.arc(sl.x,sl.y,4,0,TAU);ctx.fill();
    }
  }

  // Traps first (they lie on the ground), then turrets
  for(const pass of['path','tower'])for(const sl of G.slots){
    const t=sl.tower;if(!t||sl.k!==pass)continue;
    ctx.save();
    DRAW[t.kind](sl.x,sl.y,t);
    ctx.restore();
    drawPips(sl.x,sl.y,t);
  }

  // Range ring for selected slot
  if(G.sel&&G.sel.tower){
    ctx.strokeStyle='rgba(127,211,90,.45)';ctx.fillStyle='rgba(127,211,90,.07)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(G.sel.x,G.sel.y,rangeOf(G.sel.tower),0,TAU);ctx.fill();ctx.stroke();
  }

  // Enemies
  for(const e of G.en)if(!e.dead&&e.d>=-18)drawEnemy(e);

  // Projectiles
  for(const p of G.proj){
    if(p.kind==='shell'){
      ctx.fillStyle=p.pierce?'#ff6040':'#d8c070';ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,TAU);ctx.fill();
      ctx.strokeStyle='#40340c';ctx.lineWidth=1;ctx.stroke();
    }else{
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(p.x,p.y,5,0,TAU);ctx.fill();
      ctx.strokeStyle=p.pierce?'#ff6040':'#888';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#ffcc40';ctx.beginPath();ctx.arc(p.x+Math.cos(Date.now()*.03)*2,p.y-5,1.5,0,TAU);ctx.fill();
    }
  }
  for(const f of G.frag){
    const l=Math.hypot(f.vx,f.vy);
    ctx.strokeStyle=f.pierce?'#ff7050':'#ffe090';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx/l*6,f.y-f.vy/l*6);ctx.stroke();
  }

  // Bolts, beams and lightning
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const f of G.fx){
    ctx.globalAlpha=Math.max(0,f.life/f.max);ctx.strokeStyle=f.col;ctx.lineWidth=f.w;
    ctx.beginPath();ctx.moveTo(f.pts[0].x,f.pts[0].y);for(let i=1;i<f.pts.length;i++)ctx.lineTo(f.pts[i].x,f.pts[i].y);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Rings (frost pulse, time stop)
  for(const r of G.rings){
    ctx.globalAlpha=Math.max(0,r.life/r.max)*.7;ctx.strokeStyle=r.col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Explosions
  for(const x of G.expl){
    const a=Math.max(0,x.life/x.max);
    const g=ctx.createRadialGradient(x.x,x.y,0,x.x,x.y,Math.max(1,x.r));
    g.addColorStop(0,`rgba(255,220,100,${a*.7})`);g.addColorStop(.5,`rgba(255,100,0,${a*.5})`);g.addColorStop(1,'rgba(255,50,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x.x,x.y,x.r,0,TAU);ctx.fill();
    ctx.strokeStyle=`rgba(255,200,50,${a*.9})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x.x,x.y,x.r,0,TAU);ctx.stroke();
  }

  // Particles
  for(const p of G.part){
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Floating text
  ctx.textAlign='center';
  for(const f of G.flt){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life/f.max*2.2));
    ctx.fillStyle=f.col||(f.big?'#e6edf3':'#e6b800');
    ctx.font=(f.big?'bold 22px':'bold 11px')+' "Share Tech Mono",monospace';
    ctx.fillText(f.txt,f.x,f.y);
    if(f.sub){ctx.font='11px "Share Tech Mono",monospace';ctx.fillStyle='#7fd35a';ctx.fillText(f.sub,f.x,f.y+18);}
  }
  ctx.globalAlpha=1;ctx.textAlign='left';

  if(G.phase==='prep'){
    ctx.fillStyle='rgba(127,211,90,.55)';ctx.font='11px "Share Tech Mono",monospace';ctx.textAlign='center';
    ctx.fillText('BUILD YOUR DEFENSES, THEN PRESS START',W/2,H-14);ctx.textAlign='left';
  }
}

function drawPips(x,y,t){
  const ids=[t.ench.element,t.ench.rune].filter(Boolean);
  ids.forEach((id,i)=>{
    const px=x+(i-(ids.length-1)/2)*10,py=y+21;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.beginPath();ctx.arc(px,py,4.2,0,TAU);ctx.fill();
    ctx.fillStyle=ENCH[id].col;ctx.beginPath();ctx.arc(px,py,2.8,0,TAU);ctx.fill();
  });
}

function drawEnemy(e){
  const p=posAt(e.d),r=e.r,t=performance.now()*.001;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,r*.55,r*.9,r*.4,0,0,TAU);ctx.fill();
  ctx.rotate(p.a);
  const sw=Math.sin(t*(e.spd/6)+e.id);
  ctx.lineCap='round';
  if(e.type==='green'||e.type==='red'){
    const skin=e.type==='green'?'#6ec65a':'#d85a4a',cloth=e.type==='green'?'#3a5a8a':'#6a1a1a',dark=e.type==='green'?'#2a6a20':'#7a1010';
    ctx.strokeStyle=skin;ctx.lineWidth=3;
    for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(r*.2,s*r*.7);ctx.lineTo(r+7,s*(r*.45)+sw*s*1.6);ctx.stroke();}
    ctx.fillStyle=cloth;ctx.beginPath();ctx.ellipse(-r*.1,0,r*.7,r*.95,0,0,TAU);ctx.fill();
    ctx.fillStyle=skin;ctx.beginPath();ctx.arc(r*.25,0,r*.55,0,TAU);ctx.fill();
    ctx.strokeStyle=dark;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=e.type==='green'?'#ffee55':'#111';
    for(const s of[-1,1]){ctx.beginPath();ctx.arc(r*.55,s*r*.22,1.6,0,TAU);ctx.fill();}
  }else if(e.type==='skeleton'){
    const bone='#ece6d2',shade='#8a8470';
    ctx.strokeStyle=bone;ctx.lineWidth=2;
    for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(r*.2,s*r*.75);ctx.lineTo(r+6,s*(r*.4)+sw*s*1.8);ctx.stroke();}
    ctx.fillStyle='#cfc8b0';ctx.beginPath();ctx.ellipse(-r*.1,0,r*.6,r*.9,0,0,TAU);ctx.fill();
    ctx.strokeStyle=shade;ctx.lineWidth=1;
    for(const x of[-r*.4,-r*.1,r*.2]){ctx.beginPath();ctx.moveTo(x,-r*.65);ctx.lineTo(x,r*.65);ctx.stroke();}
    ctx.fillStyle=bone;ctx.beginPath();ctx.arc(r*.3,0,r*.55,0,TAU);ctx.fill();ctx.strokeStyle=shade;ctx.stroke();
    ctx.fillStyle='#1a1a1a';
    for(const s of[-1,1]){ctx.beginPath();ctx.arc(r*.58,s*r*.24,2.1,0,TAU);ctx.fill();}
  }else if(e.type==='king'){
    // royal cloak
    ctx.fillStyle='#5a1a6a';ctx.beginPath();ctx.ellipse(-r*.4,0,r*.95,r*1.08,0,0,TAU);ctx.fill();
    ctx.strokeStyle='#e0b838';ctx.lineWidth=1.8;ctx.stroke();
    // arms
    ctx.strokeStyle='#6ec65a';ctx.lineWidth=4.5;
    for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(r*.2,s*r*.72);ctx.lineTo(r+9,s*(r*.45)+sw*s*1.8);ctx.stroke();}
    // body & head
    ctx.fillStyle='#8a2a3a';ctx.beginPath();ctx.ellipse(-r*.05,0,r*.68,r*.88,0,0,TAU);ctx.fill();
    ctx.fillStyle='#6ec65a';ctx.beginPath();ctx.arc(r*.25,0,r*.55,0,TAU);ctx.fill();
    ctx.strokeStyle='#2a6a20';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#ff3030';
    for(const s of[-1,1]){ctx.beginPath();ctx.arc(r*.58,s*r*.22,2,0,TAU);ctx.fill();}
    // crown: a spiked golden ring around the head
    const cx=r*.25,pts=7;
    ctx.beginPath();
    for(let i=0;i<pts*2;i++){const a=i/(pts*2)*TAU,rr=i%2?r*.5:r*.78;const px=cx+Math.cos(a)*rr,py=Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();ctx.fillStyle='#f0c830';ctx.fill();ctx.strokeStyle='#a07810';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#6ec65a';ctx.beginPath();ctx.arc(cx,0,r*.42,0,TAU);ctx.fill();
    ctx.fillStyle='#d02030';ctx.beginPath();ctx.arc(cx+r*.62,0,2,0,TAU);ctx.fill();
  }else{
    ctx.strokeStyle='#1c1228';ctx.lineWidth=2;
    for(const s of[-1,1])for(let i=0;i<4;i++){
      const th=s*(0.55+i*0.6),wig=Math.sin(t*12+i*1.3+s)*.22;
      const bx=r*.3,mx=bx+Math.cos(th)*r*.9,my=Math.sin(th)*r*.9;
      const tx=bx+Math.cos(th+wig*s)*r*1.7,ty=Math.sin(th+wig*s)*r*1.7+s*r*.25;
      ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(mx,my+s*r*.25);ctx.lineTo(tx,ty);ctx.stroke();
    }
    ctx.fillStyle='#2a1a3a';ctx.beginPath();ctx.ellipse(-r*.4,0,r*.85,r*.7,0,0,TAU);ctx.fill();
    ctx.fillStyle='#5a2a7a';ctx.beginPath();ctx.ellipse(-r*.4,0,r*.35,r*.25,0,0,TAU);ctx.fill();
    ctx.fillStyle='#3a2550';ctx.beginPath();ctx.arc(r*.45,0,r*.5,0,TAU);ctx.fill();
    ctx.fillStyle='#ff3030';
    for(const s of[-1,1]){ctx.beginPath();ctx.arc(r*.78,s*r*.16,1.4,0,TAU);ctx.arc(r*.62,s*r*.32,1.1,0,TAU);ctx.fill();}
  }
  if(e.armor>0){
    ctx.strokeStyle=`rgba(170,190,210,${.35+.5*e.armor/e.maxArmor})`;ctx.lineWidth=2;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.arc(0,0,r+3,0,TAU);ctx.stroke();ctx.setLineDash([]);
  }
  // status rings
  if(e.slow&&Object.keys(e.slow).length){ctx.strokeStyle='rgba(111,216,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+5.5,0,TAU);ctx.stroke();}
  if(e.rootT>0){ctx.strokeStyle='#b07a3a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r+7,0,TAU);ctx.stroke();}
  if(e.stunT>0){ctx.strokeStyle='#ffe060';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(0,0,r+8.5,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  if(e.flash>0){ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(0,0,r+2,0,TAU);ctx.fill();}
  ctx.restore();

  if(e.burn){
    const fl=Math.sin(t*20+e.id)*1.5;
    ctx.fillStyle='#ff8a20';ctx.beginPath();ctx.moveTo(p.x-3,p.y-r+1);ctx.lineTo(p.x,p.y-r-7+fl);ctx.lineTo(p.x+3,p.y-r+1);ctx.fill();
    ctx.fillStyle='#ffe060';ctx.beginPath();ctx.moveTo(p.x-1.5,p.y-r+1);ctx.lineTo(p.x,p.y-r-3+fl);ctx.lineTo(p.x+1.5,p.y-r+1);ctx.fill();
  }
  if(e.boss||e.hp<e.maxHp||e.armor<e.maxArmor){
    const bw=e.boss?46:r*2+10,bx=p.x-bw/2,by=p.y-r-12;
    if(e.boss){ctx.fillStyle='#ffd040';ctx.font='bold 8px "Share Tech Mono",monospace';ctx.textAlign='center';ctx.fillText('KING ZOMBIE',p.x,by-9);ctx.textAlign='left';}
    ctx.fillStyle='#000a';ctx.fillRect(bx-1,by-1,bw+2,5);
    ctx.fillStyle='#e0403a';ctx.fillRect(bx,by,bw*Math.max(0,e.hp/e.maxHp),3);
    if(e.maxArmor>0){
      ctx.fillStyle='#000a';ctx.fillRect(bx-1,by-6,bw+2,4);
      ctx.fillStyle='#9fb4cc';ctx.fillRect(bx,by-5,bw*Math.max(0,e.armor/e.maxArmor),2);
    }
  }
}

// ── turret & trap art ──
const aimOf=t=>t.aim!==undefined?t.aim:-Math.PI/2;
function drawSawIcon(x,y,r,angle){
  const teeth=10;
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.beginPath();
  for(let i=0;i<teeth;i++){
    const a1=(i/teeth)*TAU,a2=((i+.35)/teeth)*TAU,a3=((i+.65)/teeth)*TAU,a4=((i+1)/teeth)*TAU;
    if(i===0)ctx.moveTo(Math.cos(a1)*r*.75,Math.sin(a1)*r*.75);else ctx.lineTo(Math.cos(a1)*r*.75,Math.sin(a1)*r*.75);
    ctx.lineTo(Math.cos(a2)*r,Math.sin(a2)*r);ctx.lineTo(Math.cos(a3)*r,Math.sin(a3)*r);ctx.lineTo(Math.cos(a4)*r*.75,Math.sin(a4)*r*.75);
  }
  ctx.closePath();
  const grd=ctx.createRadialGradient(0,0,r*.15,0,0,r);
  grd.addColorStop(0,'#e8e8e8');grd.addColorStop(.6,'#a8a8b0');grd.addColorStop(1,'#585860');
  ctx.fillStyle=grd;ctx.fill();ctx.strokeStyle='#d0d0e0';ctx.lineWidth=.7;ctx.stroke();
  ctx.fillStyle='#181820';ctx.beginPath();ctx.arc(0,0,r*.22,0,TAU);ctx.fill();
  ctx.restore();
}

// ─── UI ──────────────────────────────────────────────────────────────────────
function openModal(title,items){
  document.getElementById('mt').textContent=title;
  const mo=document.getElementById('mo');mo.innerHTML='';
  for(const it of items){
    const b=document.createElement('button');
    b.className='mb'+(it.danger?' dn':'');
    const lbl=document.createElement('span');lbl.className='lbl';
    const nm=document.createElement('span');nm.textContent=it.label;lbl.appendChild(nm);
    if(it.desc){const d=document.createElement('span');d.className='ds';d.textContent=it.desc;lbl.appendChild(d);}
    b.appendChild(lbl);
    if(it.cost!==undefined){const c=document.createElement('span');c.className='pc';c.textContent='$'+it.cost;b.appendChild(c);}
    if(it.earn!==undefined){const c=document.createElement('span');c.className='ec';c.textContent='+$'+it.earn;b.appendChild(c);}
    if(it.disabled)b.disabled=true;
    b.addEventListener('click',()=>{closeModal();it.action&&it.action();});
    mo.appendChild(b);
  }
  const cl=document.createElement('button');cl.className='mb cc';cl.textContent='✕  CLOSE';
  cl.addEventListener('click',closeModal);mo.appendChild(cl);
  document.getElementById('modal').classList.add('o');
}
function closeModal(){document.getElementById('modal').classList.remove('o');if(G)G.sel=null;}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});

function slotClick(sl){
  if(sl.tower){
    const t=sl.tower,def=TD[t.kind],items=[];
    G.sel=sl;
    if(t.kind==='sniper'){
      items.push({label:'🎯  TARGET: '+(t.mode||'strongest').toUpperCase(),desc:'Tap to cycle: strongest → armored → first → last',
        action:()=>{t.mode=MODES[(MODES.indexOf(t.mode)+1)%MODES.length];saveGame();slotClick(sl);}});
    }
    const have=(t.ench.element?1:0)+(t.ench.rune?1:0);
    for(const id of def.ench){
      const E=ENCH[id];
      if(t.ench[E.slot]===id){items.push({label:'✓  '+E.name+' (INSTALLED)',disabled:true});continue;}
      if(t.ench[E.slot])continue; // that slot is taken by another enchantment
      const cost=enchCost(t.kind,id,have);
      items.push({label:'✦  '+E.name,desc:'['+E.slot.toUpperCase()+'] '+E.desc,cost,disabled:G.money<cost,
        action:()=>{G.money-=cost;t.spent+=cost;t.ench[E.slot]=id;SFX.towerUpgrade();hud();saveGame();}});
    }
    const sv=Math.floor(t.spent*.5);
    items.push({label:'🗑  SELL',earn:sv,danger:true,desc:'Recover $'+sv+' (50% of $'+t.spent+')',
      action:()=>{G.money+=sv;sl.tower=null;hud();saveGame();}});
    openModal(def.name,items);
  }else{
    const keys=Object.keys(TD).filter(k=>TD[k].k===sl.k).sort((a,b)=>TD[a].cost-TD[b].cost);
    openModal('PLACE '+(sl.k==='path'?'TRAP':'TURRET'),keys.map(k=>({
      label:TD[k].name,desc:TD[k].desc,cost:TD[k].cost,disabled:G.money<TD[k].cost,action:()=>placeTower(sl,k)})));
  }
}
function placeTower(sl,key){
  G.money-=TD[key].cost;
  sl.tower=mkTower(key);
  SFX.towerBuild();hud();saveGame();
}

function getTouchXY(e){
  const rect=CV.getBoundingClientRect();
  const src=e.changedTouches?e.changedTouches[0]:e;
  return{x:(src.clientX-rect.left)/SC,y:(src.clientY-rect.top)/SC};
}
function handleTap(x,y){
  if(!G||G.phase==='done')return;
  for(const sl of G.slots){if(Math.hypot(x-sl.x,y-sl.y)<21){slotClick(sl);return;}}
}
CV.addEventListener('click',e=>{const p=getTouchXY(e);handleTap(p.x,p.y);});
CV.addEventListener('touchend',e=>{e.preventDefault();const p=getTouchXY(e);handleTap(p.x,p.y);});

document.getElementById('ff').addEventListener('click',()=>{
  gameSpeed=gameSpeed===1?2:gameSpeed===2?3:1;
  const btn=document.getElementById('ff');
  btn.textContent='▶▶ '+gameSpeed+'×';
  btn.classList.toggle('fast',gameSpeed>1);
});
document.getElementById('bw').addEventListener('click',()=>{
  if(!G)return;
  const bw=document.getElementById('bw');
  if(G.phase==='prep'){
    document.getElementById('sk').style.display='none';
    startWave();
    bw.textContent='⏸ PAUSE';bw.className='btn pause';bw.disabled=false;
  }else if(G.phase==='wave'||G.phase==='between'){
    gamePaused=!gamePaused;
    if(gamePaused){bw.textContent='▶ RESUME';bw.className='btn resume';}
    else{bw.textContent='⏸ PAUSE';bw.className='btn pause';}
  }
});
document.getElementById('sk').addEventListener('click',()=>{
  if(!G||G.phase!=='prep'||G.wave!==0)return;
  const funds=skipFunds(SKIP_TO);
  G.money=funds;G.wave=SKIP_TO-1;
  document.getElementById('sk').style.display='none';
  hud();startWave();
  const bw=document.getElementById('bw');
  bw.textContent='⏸ PAUSE';bw.className='btn pause';bw.disabled=false;
  G.flt.push({x:W/2,y:H/2+30,txt:'SKIPPED TO WAVE '+SKIP_TO,sub:'Starting funds: $'+funds,life:2.5,max:2.5,big:true});
});
document.getElementById('ob').addEventListener('click',()=>{
  document.getElementById('ov').classList.remove('o');
  showDifficultySelect();
});

function resetControls(){
  gameSpeed=1;
  const ff=document.getElementById('ff');ff.textContent='▶▶ 1×';ff.classList.remove('fast');
  const bw=document.getElementById('bw');bw.textContent='▶ START';bw.className='btn';bw.disabled=false;
  document.getElementById('sk').style.display=(G&&G.wave===0)?'':'none';
}

function endGame(win){
  G.phase='done';clearSavedGame();
  const ov=document.getElementById('ov');
  ov.querySelector('#ot').textContent=win?'GRAVEYARD\nSECURED':'YOU WERE\nOVERRUN';
  ov.querySelector('#ot').style.color=win?'#7fd35a':'#f85149';
  let total=0;for(let n=1;n<=WAVE_COUNT;n++)total+=waveTotal(n);
  ov.querySelector('#os').textContent=
    (win?'All '+WAVE_COUNT+' waves defeated!':'The horde broke through.')+
    '\n\nDifficulty:      '+D.name+
    '\nWave reached:    '+G.wave+' / '+WAVE_COUNT+
    '\nHearts left:     '+G.lives+
    '\nMonsters slain:  '+G.killed+' / '+total;
  ov.classList.add('o');
}

function showDifficultySelect(){
  const cards=document.getElementById('ds-cards');cards.innerHTML='';
  for(const id in DIFFS){
    const d=DIFFS[id];
    const card=document.createElement('div');card.className='mc';
    const sw=document.createElement('div');sw.className='mc-sw';sw.style.background=d.col;
    const info=document.createElement('div');
    const nm=document.createElement('div');nm.className='mc-name';nm.textContent=d.name;
    const ds=document.createElement('div');ds.className='mc-desc';ds.textContent=d.desc;
    info.append(nm,ds);card.append(sw,info);
    card.addEventListener('click',()=>selectDifficulty(id));
    cards.appendChild(card);
  }
  document.getElementById('ds').classList.add('o');
}
function selectDifficulty(id){
  document.getElementById('ds').classList.remove('o');
  init(id);hud();resetControls();
}

// ─── SAVE / LOAD ─────────────────────────────────────────────────────────────
// v1 saves (pre-runes) are migrated: the old piercing upgrade becomes the Rune of Piercing.
const SAVE_KEY='monsterturretdefense_save';
function saveGame(){
  if(!G||G.wave<1||G.phase==='done')return;
  try{
    const slots=G.slots.map(s=>s.tower?{tower:{kind:s.tower.kind,base:s.tower.base,spent:s.tower.spent,ench:{...s.tower.ench},mode:s.tower.mode}}:{tower:null});
    localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,diff:D.id,money:G.money,lives:G.lives,wave:G.wave,killed:G.killed,escaped:G.escaped,slots}));
  }catch(e){}
}
function clearSavedGame(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function readSave(){
  try{const sv=JSON.parse(localStorage.getItem(SAVE_KEY));return sv&&(sv.v===1||sv.v===2)&&DIFFS[sv.diff]?sv:null;}catch(e){return null;}
}
function loadSavedGame(){
  const sv=readSave();if(!sv)return false;
  init(sv.diff);
  G.money=sv.money;G.lives=sv.lives;G.wave=sv.wave;G.killed=sv.killed||0;G.escaped=sv.escaped||0;G.phase='prep';
  for(let i=0;i<sv.slots.length&&i<G.slots.length;i++){
    const sd=sv.slots[i];
    if(!sd||!sd.tower||!TD[sd.tower.kind])continue;
    const t=mkTower(sd.tower.kind);
    if(sv.v===2){
      t.spent=sd.tower.spent||t.base;
      t.ench={element:sd.tower.ench&&ENCH[sd.tower.ench.element]?sd.tower.ench.element:null,
              rune:sd.tower.ench&&ENCH[sd.tower.ench.rune]?sd.tower.ench.rune:null};
      if(MODES.includes(sd.tower.mode))t.mode=sd.tower.mode;
    }else if(sd.tower.ups&&sd.tower.ups.pierce){
      t.ench.rune='pierce';t.spent=t.base+enchCost(t.kind,'pierce',0);
    }
    G.slots[i].tower=t;
  }
  hud();resetControls();
  return true;
}
function showResumePrompt(sv){
  document.getElementById('rs-info').innerHTML=
    '<strong>DIFFICULTY</strong>  '+DIFFS[sv.diff].name+'<br>'+
    '<strong>WAVE</strong>  '+sv.wave+' / '+WAVE_COUNT+'<br>'+
    '<strong>HEARTS</strong>  '+sv.lives+'<br>'+
    '<strong>FUNDS</strong>  $'+sv.money;
  document.getElementById('rs').classList.add('o');
}
document.getElementById('rs-yes').addEventListener('click',()=>{
  document.getElementById('rs').classList.remove('o');
  if(!loadSavedGame())showDifficultySelect();
});
document.getElementById('rs-no').addEventListener('click',()=>{
  clearSavedGame();
  document.getElementById('rs').classList.remove('o');
  showDifficultySelect();
});

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function loop(ts){
  let dt=Math.min((ts-lastT)/1000,.07);lastT=ts;
  if(!G){requestAnimationFrame(loop);return;}
  dt*=gameSpeed;
  if(!gamePaused)upd(dt);else tickFx(dt);
  draw();requestAnimationFrame(loop);
}
{const sv=readSave();if(sv)showResumePrompt(sv);else showDifficultySelect();}
requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
</script>
